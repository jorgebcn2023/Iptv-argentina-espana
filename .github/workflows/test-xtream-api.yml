name: Xtream API tests

on:
  push:
    branches:
      - xtream-api-prototype
    paths:
      - "xtream_api.py"
      - "tests/**"
      - "requirements-xtream.txt"
      - ".github/workflows/test-xtream-api.yml"
  pull_request:
    branches:
      - xtream-api-prototype
    paths:
      - "xtream_api.py"
      - "tests/**"
      - "requirements-xtream.txt"
      - ".github/workflows/test-xtream-api.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-xtream.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-xtream.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q xtream_api.py tests
