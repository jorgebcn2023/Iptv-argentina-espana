name: CI

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate playlist generator
        run: python main.py
        timeout-minutes: 15

      - name: Validate generated playlist
        run: |
          test -s playlist.m3u
          grep -q '^#EXTM3U' playlist.m3u
          grep -q '^#EXTINF' playlist.m3u
          echo "Playlist válida: $(grep -c '^#EXTINF' playlist.m3u) canales"
