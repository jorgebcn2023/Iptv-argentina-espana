name: TITAN IPTV v2 - Build Isolated Playlist

on:
  push:
    branches: [feature/titan-iptv-v2]
    paths:
      - 'main.py'
      - 'discover_reddit.py'
      - 'resolve_youtube.py'
      - 'config/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-playlist.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist-titan-v2
  cancel-in-progress: false

jobs:
  build-titan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TITAN branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: feature/titan-iptv-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -U -r requirements.txt; fi
          pip install -U yt-dlp

      - name: Discover public Reddit sources
        run: python discover_reddit.py

      - name: Build existing playlist data
        run: python main.py

      - name: Resolve YouTube live entries
        run: python resolve_youtube.py

      - name: Validate generated outputs
        run: |
          set -euo pipefail
          for f in playlist.m3u playlist-full.m3u playlist-quarantine.m3u audit.json youtube-live.m3u youtube-audit.json config/reddit-sources.json; do
            test -s "$f"
          done
          grep -q '^#EXTM3U' playlist.m3u
          grep -q '^#EXTM3U' playlist-full.m3u
          grep -q '^#EXTM3U' playlist-quarantine.m3u
          python - <<'PY'
          import json
          from pathlib import Path
          def entries(path):
              return sum(1 for x in Path(path).read_text(encoding='utf-8').splitlines() if x.startswith('#EXTINF'))
          audit=json.loads(Path('audit.json').read_text(encoding='utf-8'))
          reddit=json.loads(Path('config/reddit-sources.json').read_text(encoding='utf-8'))
          assert isinstance(reddit.get('sources'),list)
          assert entries('playlist.m3u') == audit['stable_entries']
          assert entries('playlist-quarantine.m3u') == audit['quarantined_entries']
          assert entries('playlist-full.m3u') == audit['output_entries']
          assert entries('playlist.m3u') + entries('playlist-quarantine.m3u') == entries('playlist-full.m3u')
          print('TITAN QC PASS')
          print('Stable:', entries('playlist.m3u'))
          print('Full:', entries('playlist-full.m3u'))
          print('Quarantine:', entries('playlist-quarantine.m3u'))
          print('Reddit candidates:', len(reddit['sources']))
          PY

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit only TITAN outputs
        run: |
          set -euo pipefail
          git add playlist.m3u playlist-full.m3u playlist-quarantine.m3u audit.json youtube-live.m3u youtube-audit.json config/reddit-sources.json
          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git commit -m "chore(titan): refresh isolated IPTV build"
          git push origin HEAD:refs/heads/feature/titan-iptv-v2
