name: Update IPTV Playlist

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'resolve_youtube.py'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update-playlist.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist-main
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js for YouTube JS challenges
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U -r requirements.txt yt-dlp

      - name: Update main playlist and audit
        run: python main.py

      - name: Resolve YouTube live entries
        run: python resolve_youtube.py

      - name: Validate generated outputs
        run: |
          set -e
          for f in playlist.m3u audit.json youtube-live.m3u youtube-audit.json; do test -s "$f"; done
          grep -q '^#EXTM3U' playlist.m3u
          grep -q '^#EXTM3U' youtube-live.m3u
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('audit.json').read_text(encoding='utf-8'))
          required = {'sources', 'input_entries', 'output_entries', 'duplicates_removed', 'probe_summary', 'web_resolver_entries'}
          missing = required - set(audit)
          assert not missing, f'audit.json incompleto: {sorted(missing)}'
          entries = sum(1 for line in Path('playlist.m3u').read_text(encoding='utf-8').splitlines() if line.startswith('#EXTINF'))
          assert entries == audit['output_entries'], f'playlist/audit no coinciden: {entries} != {audit["output_entries"]}'
          ya = json.loads(Path('youtube-audit.json').read_text(encoding='utf-8'))
          print(f'Playlist válida: {entries} entradas')
          print(f'YouTube resueltos: {len(ya["resolved"])}; fallidos: {len(ya["failed"])}')
          PY

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Publish generated outputs safely
        run: |
          set -euo pipefail
          git add playlist.m3u audit.json youtube-live.m3u youtube-audit.json
          if git diff --cached --quiet; then
            echo "No hay cambios en los archivos generados."
            exit 0
          fi
          git commit -m "chore: refresh IPTV and YouTube live playlists [$(date -u +'%Y-%m-%d %H:%M:%S Z')]"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "Publicación completada."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "No se pudo publicar después de varios reintentos."
          exit 1
