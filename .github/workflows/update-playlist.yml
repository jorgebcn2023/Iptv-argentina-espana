name: Update IPTV Playlist

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update-playlist.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist-main
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update playlist
        run: python main.py

      - name: Validate generated playlist
        run: |
          test -s playlist.m3u
          grep -q '^#EXTM3U' playlist.m3u
          grep -q '^#EXTINF' playlist.m3u
          echo "Playlist válida: $(grep -c '^#EXTINF' playlist.m3u) canales"

      - name: Commit and push changes
        run: |
          set -e
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "No hay cambios en la playlist."
            exit 0
          fi

          git commit -m "chore: update playlist [$(date -u +'%Y-%m-%d %H:%M:%S Z')]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Playlist publicada correctamente."
              exit 0
            fi
            echo "Push rechazado; reintentando (${attempt}/3)..."
            sleep 3
          done

          echo "ERROR: no se pudo publicar la playlist después de 3 intentos."
          exit 1
